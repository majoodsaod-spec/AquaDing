<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#041320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aqua Ding">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Aqua Ding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centred phone column. A glowing bottle is the hero, quick-add chips sit under it, reminders and the week follow. Single deep-water theme by choice. */
:root{
  --ink:#041320;
  --deep:#082033;
  --card:#0d2c45;
  --line:rgba(140,205,255,.16);
  --text:#eaf6ff;
  --muted:#8db1cb;
  --aqua:#5ee3f2;
  --wave-a:#2fb0f2;
  --wave-b:#1273d2;
  --amber:#ffb23e;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--ink);height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
img,svg,button{-webkit-user-drag:none}
input{-webkit-user-select:text;user-select:text}
body{
  background:radial-gradient(120% 600px at 50% -80px,#0f4468 0%,var(--deep) 55%,var(--ink) 100%) no-repeat,var(--ink);
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}
.wrap{max-width:440px;margin:0 auto;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;scrollbar-width:none;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font:500 .8rem var(--body);color:var(--muted);letter-spacing:0;margin-top:6px}
.streak{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{width:18px;height:18px}

main.wrap::-webkit-scrollbar{display:none}

/* bottle */
.hero{position:relative;width:min(290px,76vw);aspect-ratio:240/400;margin:4px auto 0}
.hero svg{width:100%;height:100%;overflow:visible;display:block}
.hero.done{filter:drop-shadow(0 0 28px rgba(94,227,242,.45))}
#level{transition:transform 1.4s cubic-bezier(.25,.8,.25,1)}
.w1{animation:drift 5s linear infinite}
.w2{animation:drift 8s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.bub{fill:rgba(255,255,255,.35);animation:rise 6s ease-in infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-280px);opacity:0}}
.readout{position:absolute;left:0;right:0;top:53%;text-align:center;pointer-events:none;text-shadow:0 2px 14px rgba(0,30,60,.55)}
.pct{font-family:var(--display);font-weight:800;font-size:3.6rem;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pct span{font-size:1.5rem;font-weight:500;margin-left:2px}
.ml{margin-top:6px;font-weight:500;font-size:.95rem;font-variant-numeric:tabular-nums;color:#dff3ff}

.togo{text-align:center;color:var(--muted);font-weight:500;margin-top:-4px}
.togo b{color:var(--text)}

/* quick add */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:700;font-variant-numeric:tabular-nums;transition:transform .12s,background .2s,border-color .2s;
}
.chip:hover{border-color:rgba(94,227,242,.5)}
.chip:active{transform:scale(.94);background:#134064}
.chip svg{width:26px;height:26px}
.chip small{font-weight:500;color:var(--muted);font-size:.72rem}
.custom{display:flex;gap:10px}
.custom input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.btn{border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#6fe9f6,#35c3dc);color:#03202c}
.btn.ghost{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.03)}
.btn.warn{background:var(--amber);color:#2a1700}

/* cards */
.card{background:rgba(13,44,69,.7);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px)}
.note{font-size:.85rem;color:var(--amber);line-height:1.45}
.card h2{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.next{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.sub{color:var(--muted);font-size:.85rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4a6a82;margin-right:8px}
.dot.on{background:#46e08f;box-shadow:0 0 0 4px rgba(70,224,143,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(70,224,143,0)}}
.btns{display:flex;gap:10px}
.btns .btn{flex:1;white-space:nowrap;padding:12px 8px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);font-weight:500}
select{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:30px;border-radius:9px;background:#16405f;position:relative;flex:1;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;border-radius:9px;background:#2a8fc8;transition:height .8s}
.day.hit .bar i{background:linear-gradient(180deg,#8ff3fb,#35c3dc)}
.day.today .lbl{color:var(--aqua)}
.lbl{font-size:.72rem;color:var(--muted);font-weight:700}

/* log */
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px;max-height:210px;overflow:auto}
li{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
li:last-child{border:0}
li span:first-child{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:0 8px}

/* alert */
.alert{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,14,24,.88);backdrop-filter:blur(10px)}
.alert .box{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:rgba(255,178,62,.14);animation:ring 1.1s ease-in-out infinite}
.ring svg{width:56px;height:56px;animation:wob .5s ease-in-out infinite alternate;transform-origin:50% 10%}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,178,62,.5)}50%{box-shadow:0 0 0 26px rgba(255,178,62,0)}}
@keyframes wob{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.alert h2{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:-.03em;line-height:1}
.alert p{color:var(--muted)}
.alert .btn{width:100%;padding:16px;font-size:1.1rem}

.drop{position:fixed;top:-20px;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--aqua);z-index:60;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(30deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">Aqua Ding<small id="today"></small></div>
    <div class="streak" title="Days in a row you hit your goal">
      <svg viewBox="0 0 24 24" fill="#ffb23e" aria-hidden="true"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.4-2-1-3 3 1 5 4 5 7a7 7 0 0 1-14 0c0-6 6-7 7-13z"/></svg>
      <span id="streak">0 days</span>
    </div>
  </header>

  <section aria-label="Today's water">
    <div class="hero" id="hero">
      <svg viewBox="0 0 240 400" role="img" aria-label="Water bottle showing today's progress">
        <defs>
          <clipPath id="clip"><path id="bottleClip" d="M96 18H144V50C144 66 190 78 190 118V336C190 366 170 384 140 384H100C70 384 50 366 50 336V118C50 78 96 66 96 50Z"/></clipPath>
          <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wave-a)"/><stop offset="1" stop-color="var(--wave-b)"/></linearGradient>
          <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#1d8fe8" stop-opacity=".35"/></linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
        </defs>
        <rect x="92" y="4" width="56" height="16" rx="5" fill="#2b5b7c"/>
        <path d="M96 18H144V50C144 66 190 78 190 118V336C190 366 170 384 140 384H100C70 384 50 366 50 336V118C50 78 96 66 96 50Z" fill="rgba(8,32,51,.75)"/>
        <g clip-path="url(#clip)">
          <g id="level" style="transform:translateY(392px)">
            <g class="w2"><path id="wb" fill="url(#gb)"/></g>
            <g class="w1"><path id="wa" fill="url(#ga)"/></g>
            <circle class="bub" cx="88" cy="300" r="4" style="animation-delay:0s"/>
            <circle class="bub" cx="130" cy="320" r="3" style="animation-delay:1.7s"/>
            <circle class="bub" cx="160" cy="290" r="5" style="animation-delay:3.1s"/>
            <circle class="bub" cx="110" cy="330" r="2.5" style="animation-delay:4.4s"/>
          </g>
          <rect x="50" y="18" width="140" height="370" fill="url(#glass)"/>
        </g>
        <path d="M96 18H144V50C144 66 190 78 190 118V336C190 366 170 384 140 384H100C70 384 50 366 50 336V118C50 78 96 66 96 50Z" fill="none" stroke="rgba(190,235,255,.55)" stroke-width="3"/>
        <path d="M68 130V320" stroke="rgba(255,255,255,.28)" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="readout">
        <div class="pct"><b id="pct">0</b><span>%</span></div>
        <div class="ml" id="ml">0 / 2,500 ml</div>
      </div>
    </div>
    <p class="togo" id="togo" style="margin-top:14px"></p>
  </section>

  <section aria-label="Log water" style="display:flex;flex-direction:column;gap:10px">
    <div class="chips">
      <button class="chip" data-ml="100"><svg viewBox="0 0 24 24" fill="#5ee3f2"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>+100<small>sip</small></button>
      <button class="chip" data-ml="250"><svg viewBox="0 0 24 24" fill="none" stroke="#5ee3f2" stroke-width="2" stroke-linejoin="round"><path d="M6 4h12l-1.4 15a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.8z" fill="rgba(94,227,242,.3)"/></svg>+250<small>glass</small></button>
      <button class="chip" data-ml="500"><svg viewBox="0 0 24 24" fill="none" stroke="#5ee3f2" stroke-width="2" stroke-linejoin="round"><path d="M10 2h4v3c0 1 3 2 3 5v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V10c0-3 3-4 3-5z" fill="rgba(94,227,242,.3)"/></svg>+500<small>bottle</small></button>
      <button class="chip" id="customBtn" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="#5ee3f2" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Other<small>amount</small></button>
    </div>
    <form class="custom" id="customForm" hidden>
      <input id="customMl" type="number" inputmode="numeric" min="10" max="2000" step="10" placeholder="Amount in ml" aria-label="Custom amount in millilitres">
      <button class="btn primary" type="submit">Add</button>
    </form>
    <button class="btn ghost" id="undo" style="align-self:center;padding:8px 16px;font-size:.85rem">Undo last</button>
  </section>

  <section class="card" aria-label="Reminders">
    <div class="row">
      <div>
        <div class="sub"><span class="dot" id="dot"></span><span id="state">Reminders off</span></div>
        <div class="next" id="next" style="margin-top:8px">--:--</div>
      </div>
      <div class="sub" style="text-align:right" id="nextSub">until next ding</div>
    </div>
    <div class="btns">
      <button class="btn primary" id="toggle">Start reminders</button>
      <button class="btn ghost" id="test">Test ding</button>
    </div>
    <p class="note" id="note" hidden></p>
    <div class="settings">
      <label class="f">Daily goal<select id="goal"></select></label>
      <label class="f">Ding every<select id="every"></select></label>
      <label class="f">From<select id="from"></select></label>
      <label class="f">Until<select id="to"></select></label>
    </div>
  </section>

  <section class="card" aria-label="This week">
    <h2>Last 7 days</h2>
    <div class="week" id="week"></div>
  </section>

  <section class="card" aria-label="Today's log">
    <h2>Today</h2>
    <ul id="log"></ul>
  </section>

  <footer>Install to your home screen and tap Start reminders to get reminders even when the app is closed. Keep notifications on for Aqua Ding.</footer>
</main>

<div class="alert" id="alert" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" hidden>
  <div class="box">
    <div class="ring"><svg viewBox="0 0 24 24" fill="#ffb23e"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></div>
    <h2 id="alertTitle">Drink water</h2>
    <p id="alertSub"></p>
    <button class="btn warn" id="alertLog">I drank 250 ml</button>
    <button class="btn ghost" id="alertSnooze">Snooze 5 min</button>
  </div>
</div>

<script>
/* lock gestures: no pinch zoom, no context menu, no drag */
['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()});});
document.addEventListener('contextmenu',function(ev){ev.preventDefault()});
document.addEventListener('touchmove',function(ev){if(ev.touches.length>1)ev.preventDefault()},{passive:false});
document.addEventListener('dragstart',function(ev){ev.preventDefault()});
document.addEventListener('wheel',function(ev){if(ev.ctrlKey)ev.preventDefault()},{passive:false});

(function(){
  var $ = function(s){return document.querySelector(s)};
  var LS = 'aqua-ding.v2', LS_OLD = 'aqua-ding.v1';
  var S = {goal:2500, every:45, from:8, to:22, logs:{}, amt:250, armed:false, mode:'', id:'', savedAt:0};
  function merge(r){ if (!r) return; Object.keys(S).forEach(function(k){ if (r[k] !== undefined) S[k] = r[k]; }); }
  try { merge(JSON.parse(localStorage.getItem(LS) || localStorage.getItem(LS_OLD) || 'null')); } catch(e){}

  /* storage: localStorage plus an IndexedDB mirror (the service worker reads the mirror) */
  var idb = null;
  function idbOpen(cb){
    try {
      var r = indexedDB.open('aqua-ding', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ idb = r.result; cb(); };
      r.onerror = function(){ cb(); };
    } catch(e){ cb(); }
  }
  function idbPut(){ try { if (idb) idb.transaction('kv', 'readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)), 'state'); } catch(e){} }
  function idbGet(cb){
    try {
      if (!idb) return cb(null);
      var q = idb.transaction('kv').objectStore('kv').get('state');
      q.onsuccess = function(){ cb(q.result || null); };
      q.onerror = function(){ cb(null); };
    } catch(e){ cb(null); }
  }
  function save(){ S.savedAt = Date.now(); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} idbPut(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

  function pad(n){return n < 10 ? '0' + n : '' + n}
  function key(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function total(k){ return (S.logs[k] || []).reduce(function(a,b){return a + b.ml}, 0); }
  function fmt(n){ return n.toLocaleString('en-US'); }
  function clock(ts){ return new Date(ts).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); }
  function tz(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch(e){ return 'UTC'; } }

  /* wave paths: period 120, so a 120px slide loops with no seam */
  function wave(amp, phase){
    var p = 'M-120 0', x;
    for (x = -120; x <= 480; x += 10) p += ' L' + x + ' ' + (amp * Math.sin((x + phase) / 120 * 2 * Math.PI)).toFixed(2);
    return p + ' L480 440 L-120 440 Z';
  }
  $('#wa').setAttribute('d', wave(7, 0));
  $('#wb').setAttribute('d', wave(9, 45));

  /* settings controls */
  function fill(sel, vals, cur, label){
    var el = $(sel); el.innerHTML = '';
    vals.forEach(function(v){ var o = document.createElement('option'); o.value = v; o.textContent = label(v); if (v === cur) o.selected = true; el.appendChild(o); });
  }
  function fillControls(){
    var goals = []; for (var g = 1500; g <= 4500; g += 250) goals.push(g);
    fill('#goal', goals, S.goal, function(v){return fmt(v) + ' ml'});
    fill('#every', [1, 15, 20, 30, 45, 60, 90, 120], S.every, function(v){return v === 1 ? '1 min (test)' : v + ' min'});
    fill('#from', [5,6,7,8,9,10,11,12], S.from, function(v){return pad(v) + ':00'});
    fill('#to', [17,18,19,20,21,22,23,24], S.to, function(v){return v === 24 ? '24:00' : pad(v) + ':00'});
  }
  fillControls();
  ['goal','every','from','to'].forEach(function(id){
    $('#' + id).addEventListener('change', function(e){
      S[id] = parseInt(e.target.value, 10); save();
      if (on) { if (mode === 'push') api('settings').then(applyServer).catch(function(){}); else schedule(); }
      render();
    });
  });

  /* ---------- sound ---------- */
  /* Dings are real audio files played through an <audio> element, which keeps playing when the iPhone ringer is on silent. Web Audio is the fallback. */
  var ctx = null, master = null;
  function audio(){
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 1;
        var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 10;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch(e){ ctx = null; }
    return ctx;
  }
  function waBell(c, t, f, vol){
    [[1,1,1.9],[2.01,.7,1.4],[2.76,.55,1.0],[4.1,.35,.6],[5.4,.22,.4]].forEach(function(p){
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * p[1], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + p[2] + 0.1);
    });
  }
  function waDing(){ var c = audio(); if (!c) return; var t = c.currentTime + 0.03; [0, .55, 1.1].forEach(function(o, i){ waBell(c, t + o, i === 1 ? 1319 : 988, .6); }); }
  function waBlip(){
    var c = audio(); if (!c) return;
    [[0, 420], [.11, 540]].forEach(function(b){
      var t = c.currentTime + b[0], o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(b[1], t); o.frequency.exponentialRampToValueAtTime(b[1] * 2.2, t + .06);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + .14);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .16);
    });
  }
  function waCheer(){ var c = audio(); if (!c) return; var t = c.currentTime + .05; [523, 659, 784, 1046, 1319].forEach(function(f, i){ waBell(c, t + i * .13, f, .35); }); }

  var SR = 32000, urls = null, snd = null;
  function wavUrl(len, level, fillFn){
    var n = Math.floor(SR * len), f = new Float32Array(n), i, pk = 0;
    fillFn(f);
    for (i = 0; i < n; i++) pk = Math.max(pk, Math.abs(f[i]));
    var g = pk ? level / pk : 1, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    function ws(o, s){ for (var j = 0; j < s.length; j++) v.setUint8(o + j, s.charCodeAt(j)); }
    ws(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    ws(36,'data'); v.setUint32(40, n * 2, true);
    for (i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, f[i] * g)) * 32767, true);
    return URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
  }
  function addBell(f, t0, fr, vol){
    [[1,1,1.9],[2.01,.7,1.4],[2.76,.55,1.0],[4.1,.35,.6],[5.4,.22,.4]].forEach(function(p){
      var start = Math.floor(t0 * SR), N = Math.floor(p[2] * SR), w = 2 * Math.PI * fr * p[0] / SR;
      for (var i = 0; i < N && start + i < f.length; i++) {
        var t = i / SR;
        f[start + i] += Math.sin(w * i) * Math.min(1, t / 0.006) * Math.exp(-5.5 * t / p[2]) * vol * p[1];
      }
    });
  }
  function buildSounds(){
    urls = {
      ding: wavUrl(3.4, .98, function(f){ addBell(f, 0, 988, 1); addBell(f, .55, 1319, 1); addBell(f, 1.1, 988, 1); }),
      /* two soft bubble pops, no noise */
      blip: wavUrl(.32, .4, function(f){
        [[0.02, 420], [0.13, 540]].forEach(function(b){
          var st = Math.floor(b[0] * SR), N = Math.floor(.14 * SR), ph = 0;
          for (var j = 0; j < N && st + j < f.length; j++) {
            var tt = j / SR, fr = b[1] * (1 + 1.4 * Math.min(tt / .06, 1));
            ph += 2 * Math.PI * fr / SR;
            f[st + j] += Math.sin(ph) * Math.min(1, tt / .006) * Math.exp(-tt * 32);
          }
        });
      }),
      cheer: wavUrl(2.2, .75, function(f){ [523, 659, 784, 1046, 1319].forEach(function(fr, i){ addBell(f, i * .13, fr, 1); }); })
    };
  }
  function play(name, fallback){
    try {
      if (!snd) {
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
        buildSounds(); snd = new Audio(); snd.preload = 'auto';
      }
      snd.src = urls[name]; snd.currentTime = 0;
      var p = snd.play();
      if (p && p.catch) p.catch(function(){ fallback(); });
    } catch(e){ fallback(); }
  }
  function ding(){ audio(); play('ding', waDing); try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]); } catch(e){} }
  function blip(){ audio(); play('blip', waBlip); }
  function cheer(){ audio(); play('cheer', waCheer); }

  function confetti(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 34; i++) {
      var d = document.createElement('span'); d.className = 'drop';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.animationDelay = (Math.random() * .6) + 's';
      d.style.opacity = (.5 + Math.random() * .5).toFixed(2);
      document.body.appendChild(d);
      setTimeout(function(n){ n.remove(); }.bind(null, d), 2800);
    }
  }

  /* ---------- server sync (background push reminders) ---------- */
  var on = false, mode = '', nextAt = 0, alertOpen = false, ringTimer = null, rings = 0, wake = null, lastFired = 0;

  function ensureId(){
    if (S.id) return;
    var a = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(a);
    S.id = Array.prototype.map.call(a, function(x){ return (x < 16 ? '0' : '') + x.toString(16); }).join('');
    save();
  }
  function api(action, extra){
    ensureId();
    var body = Object.assign({id: S.id, action: action, settings: {every: S.every, from: S.from, to: S.to, tz: tz()}}, extra || {});
    return fetch('/api/sync', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)})
      .then(function(r){ if (!r.ok) throw new Error('sync ' + r.status); return r.json(); });
  }
  function applyServer(r){ if (r && r.active) { on = true; mode = 'push'; nextAt = r.nextAt; } renderTimer(); }
  function note(msg){ var n = $('#note'); n.textContent = msg || ''; n.hidden = !msg; }
  function standalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function b64ToU8(s){
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function closeNotifs(){
    try {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistration().then(function(reg){
        if (reg && reg.getNotifications) reg.getNotifications({tag: 'aqua-ding'}).then(function(a){ a.forEach(function(n){ n.close(); }); });
      }).catch(function(){});
    } catch(e){}
  }

  function schedule(){
    var t = Date.now() + S.every * 60000, d = new Date(t);
    if (d.getHours() < S.from) { d.setHours(S.from, 0, 0, 0); t = d.getTime(); }
    else if (d.getHours() >= S.to) { d.setDate(d.getDate() + 1); d.setHours(S.from, 0, 0, 0); t = d.getTime(); }
    nextAt = t;
  }
  function keepAwake(){
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wake = l; }).catch(function(){}); } catch(e){}
  }

  function startLocal(msg){
    on = true; mode = 'local'; S.armed = true; S.mode = 'local'; save(); schedule(); keepAwake(); note(msg || ''); render();
  }
  function startReminders(){
    blip();
    if (!pushSupported()) {
      startLocal(isIOS() && !standalone()
        ? 'For reminders when the app is closed: tap Share, then Add to Home Screen, open Aqua Ding from your home screen, and tap Start again. Until then dings only play while this page is open.'
        : 'This browser cannot send background reminders. Dings play while the app is open.');
      return;
    }
    var perm = Notification.permission;
    var permP = perm === 'default' ? Notification.requestPermission() : Promise.resolve(perm);
    Promise.resolve(permP).then(function(p){
      if (p !== 'granted') { startLocal('Notifications are blocked. Turn them on in Settings, Notifications, Aqua Ding, then tap Start again. Until then dings only play while the app is open.'); return; }
      return Promise.all([navigator.serviceWorker.ready, fetch('/api/vapid').then(function(r){ return r.json(); })]).then(function(x){
        var reg = x[0], keyB64 = x[1].key;
        return reg.pushManager.getSubscription().then(function(sub){
          return sub || reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64ToU8(keyB64)});
        });
      }).then(function(sub){
        return api('subscribe', {sub: sub.toJSON()});
      }).then(function(r){
        on = true; mode = 'push'; nextAt = r.nextAt; S.armed = true; S.mode = 'push'; save(); note(''); render();
      });
    }).catch(function(){
      startLocal('Could not reach the reminder server. Dings play while the app is open. Check your connection and tap Start again.');
    });
  }
  function stopReminders(){
    var was = mode;
    on = false; mode = ''; S.armed = false; S.mode = ''; save(); closeAlert(); note('');
    try { if (wake) wake.release(); } catch(e){}
    if (was === 'push') api('stop').catch(function(){});
    render();
  }
  $('#toggle').addEventListener('click', function(){ if (on) stopReminders(); else startReminders(); });
  $('#test').addEventListener('click', function(){ ding(); });

  /* resume after the app was closed */
  function resume(){
    if (!S.armed) return;
    if (S.mode === 'push' && S.id) {
      api('status').then(function(r){
        if (r.active) applyServer(r); else { S.armed = false; S.mode = ''; save(); }
        render();
      }).catch(function(){ on = true; mode = 'push'; nextAt = Date.now() + S.every * 60000; render(); });
    }
  }
  document.addEventListener('pointerdown', function(e){
    if (S.armed && S.mode === 'local' && !on && !(e.target.closest && e.target.closest('#toggle'))) { audio(); startLocal(''); }
  });
  function refreshStatus(){
    if (on && mode === 'push' && S.id) api('status').then(applyServer).catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') { if (on && mode === 'local') keepAwake(); refreshStatus(); render(); }
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(e){
      if (e.data && e.data.type === 'pushed' && document.visibilityState === 'visible' && on && !alertOpen && Date.now() - lastFired > 60000) {
        closeNotifs(); fireAlert(); refreshStatus();
      }
    });
  }

  /* ---------- logging ---------- */
  function add(ml){
    var k = key(), before = total(k);
    (S.logs[k] = S.logs[k] || []).push({t: Date.now(), ml: ml});
    S.amt = ml; save();
    var after = total(k);
    if (before < S.goal && after >= S.goal) { cheer(); confetti(); } else { blip(); }
    closeNotifs(); closeAlert();
    if (on) { if (mode === 'push') api('logged').then(applyServer).catch(function(){}); else schedule(); }
    render();
  }
  document.querySelectorAll('.chip[data-ml]').forEach(function(b){
    b.addEventListener('click', function(){ add(parseInt(b.dataset.ml, 10)); });
  });
  $('#customBtn').addEventListener('click', function(){
    var f = $('#customForm'); f.hidden = !f.hidden;
    this.setAttribute('aria-expanded', String(!f.hidden));
    if (!f.hidden) $('#customMl').focus();
  });
  $('#customForm').addEventListener('submit', function(e){
    e.preventDefault(); var v = parseInt($('#customMl').value, 10);
    if (v >= 10 && v <= 2000) { add(v); $('#customMl').value = ''; this.hidden = true; $('#customBtn').setAttribute('aria-expanded', 'false'); }
  });
  $('#undo').addEventListener('click', function(){
    var a = S.logs[key()]; if (a && a.length) { a.pop(); save(); render(); }
  });

  /* ---------- in-app alert ---------- */
  function ringNow(){
    ding();
    if (++rings >= 8) { clearInterval(ringTimer); ringTimer = null; }
  }
  function fireAlert(){
    alertOpen = true; rings = 0; lastFired = Date.now();
    var left = Math.max(S.goal - total(key()), 0);
    $('#alertSub').textContent = left > 0 ? fmt(left) + ' ml to go today.' : 'Goal done. A little extra never hurts.';
    $('#alertLog').textContent = 'I drank ' + S.amt + ' ml';
    $('#alert').hidden = false;
    try { $('#alertLog').focus(); } catch(e){}
    ringNow(); ringTimer = setInterval(ringNow, 12000);
  }
  function closeAlert(){
    alertOpen = false; $('#alert').hidden = true;
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
  }
  $('#alertLog').addEventListener('click', function(){ add(S.amt); });
  $('#alertSnooze').addEventListener('click', function(){
    closeAlert(); closeNotifs();
    if (mode === 'push') api('snooze', {minutes: 5}).then(applyServer).catch(function(){});
    else nextAt = Date.now() + 5 * 60000;
    render();
  });

  /* ---------- clock ---------- */
  var curDay = key(), lastPoll = 0;
  setInterval(function(){
    var now = Date.now();
    if (key() !== curDay) { curDay = key(); render(); }
    if (on && !alertOpen && document.visibilityState === 'visible') {
      if (mode === 'local' && now >= nextAt) fireAlert();
      /* push mode: the push message rings the app; this is the backup if the message was late */
      else if (mode === 'push' && now >= nextAt + 20000 && now < nextAt + 120000 && now - lastFired > 60000) fireAlert();
    }
    if (on && mode === 'push' && document.visibilityState === 'visible' && now - lastPoll > 300000) { lastPoll = now; refreshStatus(); }
    renderTimer();
  }, 1000);

  function renderTimer(){
    $('#dot').className = 'dot' + (on ? ' on' : '');
    $('#toggle').textContent = on ? 'Stop reminders' : 'Start reminders';
    if (!on) {
      $('#state').textContent = S.armed && S.mode === 'local' ? 'Tap anywhere to resume' : 'Reminders off';
      $('#next').textContent = '--:--';
      $('#nextSub').textContent = 'tap start to turn on the ding';
      return;
    }
    $('#state').textContent = mode === 'push' ? 'Reminders on, works when closed' : 'Reminders on, keep app open';
    var s = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    $('#next').textContent = (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(sec);
    $('#nextSub').textContent = 'next ding at ' + clock(nextAt);
  }

  /* ---------- render ---------- */
  function streak(){
    var d = new Date(), n = 0;
    if (total(key(d)) < S.goal) d.setDate(d.getDate() - 1);
    while (total(key(d)) >= S.goal) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function render(){
    var k = key(), t = total(k), f = Math.min(t / S.goal, 1);
    $('#today').textContent = new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
    $('#level').style.transform = 'translateY(' + (f === 0 ? 392 : 384 - f * 322) + 'px)';
    $('#pct').textContent = Math.round(t / S.goal * 100);
    $('#ml').textContent = fmt(t) + ' / ' + fmt(S.goal) + ' ml';
    $('#hero').classList.toggle('done', t >= S.goal);
    var left = S.goal - t;
    $('#togo').innerHTML = left > 0 ? '<b>' + fmt(left) + ' ml</b> to go' : '<b>Goal reached.</b> Nice work.';
    var n = streak(); $('#streak').textContent = n + (n === 1 ? ' day' : ' days');

    var a = (S.logs[k] || []).slice().reverse(), ul = $('#log'); ul.innerHTML = '';
    if (!a.length) { var e = document.createElement('li'); e.innerHTML = '<span class="empty">Nothing logged yet. Tap a size above.</span>'; ul.appendChild(e); }
    a.forEach(function(x){
      var li = document.createElement('li');
      li.innerHTML = '<span>' + clock(x.t) + '</span><strong>+' + x.ml + ' ml</strong>';
      ul.appendChild(li);
    });

    var wk = $('#week'); wk.innerHTML = '';
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var v = total(key(d)), pct = Math.min(v / S.goal, 1) * 100;
      var el = document.createElement('div');
      el.className = 'day' + (v >= S.goal ? ' hit' : '') + (i === 0 ? ' today' : '');
      el.title = fmt(v) + ' ml';
      el.innerHTML = '<div class="bar"><i style="height:' + pct + '%"></i></div><div class="lbl">' + d.toLocaleDateString(undefined, {weekday:'narrow'}) + '</div>';
      wk.appendChild(el);
    }
    renderTimer();
  }

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
  }
  render();
  idbOpen(function(){
    idbGet(function(r){
      if (r && (r.savedAt || 0) > S.savedAt) {
        merge(r); try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
        fillControls(); render();
      } else idbPut();
      resume();
    });
  });
})();
</script>
</body>
</html>
